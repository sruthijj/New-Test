apiVersion: v1
kind: Service
metadata:
  name: new-test-service
  namespace: production
  labels:
    app: new-test
spec:
  selector:
    app: new-test
  type: ClusterIP          # change to LoadBalancer or NodePort if needed
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
